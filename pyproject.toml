[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leadfinder-cli"
version = "0.5.0"
description = "A Python CLI for collecting, checking, scoring, and exporting local business leads"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Junaid Khan" }]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "tenacity>=8.3.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pandas>=2.2.0",
    "PyYAML>=6.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",
    "types-openpyxl>=3.1.0",
]

[project.scripts]
lead-finder = "lead_finder.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_finder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["lead_finder"]
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
